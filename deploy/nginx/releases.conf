# Included from the HTTPS server that proxies Eurith API requests.
# The internal location can only be reached by X-Accel-Redirect from FastAPI.
location /_release_files/ {
    internal;
    alias /srv/eurith/releases/;
}

# CI is the only caller of this endpoint.  Stream its APK directly to the API:
# buffering would duplicate an APK in the nginx container/filesystem.  Leave
# 6 MiB multipart overhead above the API's strict 250 MiB artifact limit.
location /internal/app-releases/ {
    client_max_body_size 256m;
    proxy_request_buffering off;
    proxy_pass http://api;
}
