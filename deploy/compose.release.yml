services:
  api:
    env_file:
      - /etc/eurith/api-release.env
    group_add:
      - "${RELEASE_SHARED_GID:?set in /etc/eurith/release-deploy.env}"
    volumes:
      - /opt/eurith/releases:/var/lib/eurith/releases:rw
    expose:
      - "8000"

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    entrypoint:
      - /bin/sh
      - /usr/local/bin/caddy-entrypoint.sh
    command: []
    read_only: true
    group_add:
      - "${RELEASE_SHARED_GID:?set in /etc/eurith/release-deploy.env}"
    volumes:
      - type: bind
        source: ./backend/deploy/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/deploy/caddy/caddy-entrypoint.sh
        target: /usr/local/bin/caddy-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/eurith/release-caddy-view/android/sha256
        target: /srv/eurith/releases/android/sha256
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/eurith/release-caddy-view/.probe
        target: /run/eurith-release-view-probe
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  caddy_data: {}
  caddy_config: {}

# Machine-readable pre-start security contract. Host provisioning must create
# this view as a bind mount and remount it ro,nosymfollow. Deployment remains
# blocked until every probe succeeds with the actual Caddy container identity.
x-eurith-release-view-contract:
  source: /opt/eurith/releases/android/sha256
  view: /opt/eurith/release-caddy-view/android/sha256
  probe: /opt/eurith/release-caddy-view/.probe
  required_vfs_options:
    - ro
    - nosymfollow
  blocking_probes:
    - host-regular-file-readable
    - host-external-symlink-denied
    - container-vfs-ro-nosymfollow
    - container-external-symlink-denied
