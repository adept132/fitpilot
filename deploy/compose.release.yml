services:
  api:
    env_file:
      - /etc/eurith/api-release.env
    group_add:
      - "${RELEASE_SHARED_GID:?set in /etc/eurith/release-deploy.env}"
    volumes:
      - /opt/eurith/releases:/var/lib/eurith/releases:rw
    expose:
      - "8000"

  release-view-gate:
    image: caddy:2.11.4
    restart: "no"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/release-view-gate.sh
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${RELEASE_SHARED_GID:?set in /etc/eurith/release-deploy.env}"
    volumes:
      - type: bind
        source: ./backend/deploy/caddy/release-view-gate.sh
        target: /usr/local/bin/release-view-gate.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/eurith/release-caddy-view
        target: /srv/eurith/releases/android/sha256
        read_only: true
        bind:
          create_host_path: false

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      release-view-gate:
        condition: service_completed_successfully
    group_add:
      - "${RELEASE_SHARED_GID:?set in /etc/eurith/release-deploy.env}"
    volumes:
      - type: bind
        source: ./backend/deploy/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/eurith/release-caddy-view
        target: /srv/eurith/releases/android/sha256
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  caddy_data: {}
  caddy_config: {}

# Machine-readable pre-start security contract. Host provisioning must create
# this view as a bind mount and remount it ro,nosymfollow. Deployment remains
# blocked until every probe succeeds with the actual Caddy container identity.
x-eurith-release-view-contract:
  source: /opt/eurith/releases/android/sha256
  view: /opt/eurith/release-caddy-view
  required_vfs_options:
    - ro
    - nosymfollow
  blocking_probes:
    - host-regular-file-readable
    - host-external-symlink-denied
    - container-vfs-ro-nosymfollow
    - container-external-symlink-denied
